<body>
<div class="toolbar" aria-label="邀请函内容编辑">
  <label>受邀社团名称<input id="recipient-input" value="受邀社团名称" maxlength="48"></label>
  <button id="print-button" type="button">打印 / 另存为 PDF</button>
  <small>修改社团名称即可预览对应邀请函。确认格式后可按社团名单批量生成。</small>
</div>
<main class="invitation" aria-label="数学建模协会2026年换届大会邀请函">
  <header class="hero">
    <div class="badge"><img src="数学建模协会会徽原图.jpg" alt="桂林航天工业学院数学建模协会会徽" width="864" height="1920"></div>
    <div class="edition">2026</div>
    <div class="hairline"></div>
    <svg class="math-art" viewBox="0 0 484 345" aria-hidden="true"><defs><radialGradient id="halo"><stop stop-color="#427f95" stop-opacity=".35"/><stop offset="1" stop-color="#102d46" stop-opacity="0"/></radialGradient></defs><ellipse cx="270" cy="185" rx="235" ry="165" fill="url(#halo)"/><g id="surface-grid" fill="none"></g><g stroke="#cdb785" opacity=".4" stroke-width="1"><path d="M90 284 L428 284 M120 310 L120 45"/><path d="M421 280 L428 284 L421 288 M116 52 L120 45 L124 52"/></g><g fill="#cbb584" font-family="Georgia,serif" font-style="italic" font-size="17" opacity=".65"><text x="435" y="290">x</text><text x="114" y="35">z</text><text x="316" y="72">z = f(x, y)</text></g><g id="surface-points"></g></svg>
    <h1 class="title">邀请函</h1>
    <div class="english">INVITATION</div>
    <div class="event">2026年换届大会</div>
  </header>
  <section class="body">
    <div class="recipient-label">尊敬的</div>
    <h2 class="recipient" id="recipient">尊敬的受邀社团名称：</h2>
    <p class="salutation">您好！</p>
    <p class="message">我协会将举办2026年换届大会，回顾过去一年的工作，见证新一届理事会接棒。</p>
    <p class="message">诚邀贵社团选派<strong>1—2名代表</strong>莅临观礼，共叙友谊，见证传承。</p>
    <div class="details">
      <div class="detail-label">日期</div><div class="date">2026年10月24日18:00-20:00</div>
      <div class="detail-label">地点</div><div class="detail-value">北校电教馆</div>
    </div>
    <p class="notice"><strong>请到场代表提前十分钟入场。</strong></p>
    <p class="closing">期待与您相聚！</p>
  </section>
  <svg class="bottom-art" viewBox="0 0 235 160" aria-hidden="true"><g stroke="#a78f61" fill="none" stroke-width="1"><path d="M10 126H225M34 152V8" opacity=".25"/><path d="M12 125C44 128 54 112 76 92S112 88 130 57S180 63 211 17"/><path d="M12 139C60 139 86 119 109 102S158 104 174 71S207 69 225 47" opacity=".35"/><circle cx="76" cy="92" r="4" fill="#f6f2e9"/><circle cx="130" cy="57" r="4" fill="#f6f2e9"/><circle cx="211" cy="17" r="4" fill="#f6f2e9"/></g></svg>
  <footer class="signature"><div class="name">数学建模协会</div><div class="issued">2026年10月20日</div></footer>
  <div class="bottom"></div>
</main>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  if (params.has('preview')) document.body.classList.add('preview');
  const rInput = document.getElementById('recipient-input');
  const recipient = document.getElementById('recipient');
  if (params.has('recipient')) rInput.value=params.get('recipient');
  if (params.get('kind') === '校级组织') {
    const invitationParagraph = document.querySelectorAll('.message')[1];
    invitationParagraph.innerHTML = invitationParagraph.innerHTML.replace('贵社团', '贵组织');
  }
  function update() {
    recipient.textContent='尊敬的'+(rInput.value.trim().replace(/^尊敬的/, '').replace(/[：:]$/, '') || '受邀社团名称')+'：';
    recipient.style.fontSize = recipient.textContent.length > 24 ? '30px' : recipient.textContent.length > 20 ? '33px' : '37px';
  }
  rInput.addEventListener('input',update);update();
  document.getElementById('print-button').addEventListener('click',()=>window.print());
  const ns='http://www.w3.org/2000/svg';
  const grid=document.getElementById('surface-grid');
  function project(x,y) {const z=.46*(x*x-y*y);return [248+61*x+38*y,190+18*x-24*y-24*z];}
  for (let axis=0;axis<2;axis++) for(let k=-10;k<=10;k++) {
    const points=[];
    for(let j=0;j<=80;j++){const t=-2+4*j/80;const a=k/5;const p=axis?project(t,a):project(a,t);points.push(p.map(n=>n.toFixed(2)).join(','));}
    const path=document.createElementNS(ns,'polyline');path.setAttribute('points',points.join(' '));path.setAttribute('stroke',axis?'#dbc28d':'#9ebbc4');path.setAttribute('stroke-width',k===0?'1.6':'.8');path.setAttribute('opacity',axis?'.63':'.39');grid.appendChild(path);
  }
  [[-1.2,-.6],[.4,1.2],[1.4,.4]].forEach(([x,y])=>{const p=project(x,y);const c=document.createElementNS(ns,'circle');c.setAttribute('cx',p[0]);c.setAttribute('cy',p[1]);c.setAttribute('r','4');c.setAttribute('fill','#e8cf9b');document.getElementById('surface-points').appendChild(c);});
})();
</script>
